[global_config]
  suppress_multiple_term_dialog = True
  title_hide_sizetext = True
[keybindings]
[profiles]
  [[default]]
    use_system_font = False
    font = JetBrains Mono 10
    background_color = "#000000"
    foreground_color = "#ffffff"
    cursor_color = "#00ffff"
    scrollbar_position = disabled
    show_titlebar = False
[layouts]
  [[default]]
    [[[window0]]]
      type = Window
      parent = ""
    [[[terminal1]]]
      type = Terminal
      parent = window0
[plugins]
