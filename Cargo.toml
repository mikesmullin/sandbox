[package]
name = "sbox-b"
version = "1.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
description = "sbox B-SIDE — the headless backend: container orchestration, the AJCS API, and the spacesd viewer/agent planes."

[[bin]]
name = "sbox-b"
path = "src/main.rs"

[[bin]]
name = "sbox-lan"
path = "src/bin/sbox-lan.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "process", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
debug = 1
