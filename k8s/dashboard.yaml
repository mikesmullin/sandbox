apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: agent-desktop
  labels:
    app: dashboard
spec:
  replicas: 0
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      serviceAccountName: dashboard
      containers:
        - name: dashboard
          image: agent-desktop-ui:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: NAMESPACE
              value: agent-desktop
            - name: DESKTOP_APP
              value: container
            - name: DESKTOP_STATEFULSET
              value: container
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: agent-desktop
  labels:
    app: dashboard
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
