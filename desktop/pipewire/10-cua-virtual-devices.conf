context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "cua_desktop"
            node.description = "CUA desktop audio"
            media.class      = "Audio/Sink"
            audio.position   = [ FL FR ]
            audio.rate       = 48000
            priority.session = 2000
            priority.driver  = 2000
            monitor.channel-volumes = true
            object.linger    = true
        }
    }
]

context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "CUA virtual microphone"
            audio.position   = [ FL FR ]
            capture.props = {
                node.name        = "cua_mic_in"
                node.description = "CUA microphone feed (uplink input)"
                media.class      = "Audio/Sink"
                priority.session = 100
                object.linger    = true
            }
            playback.props = {
                node.name        = "cua_mic"
                node.description = "CUA virtual microphone"
                media.class      = "Audio/Source"
                priority.session = 2000
                object.linger    = true
            }
        }
    }
]
