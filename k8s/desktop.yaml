apiVersion: v1
kind: Service
metadata:
  name: container
  namespace: agent-desktop
  labels:
    app: container
spec:
  clusterIP: None
  selector:
    app: container
  ports:
    - name: novnc
      port: 6080
      targetPort: novnc
    - name: agent
      port: 8091
      targetPort: agent
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: container
  namespace: agent-desktop
  labels:
    app: container
spec:
  serviceName: container
  # Template only. Live pods are created as container-<6hex> via the control room
  # so a deleted instance is never recreated under the same name.
  replicas: 0
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: container
  template:
    metadata:
      labels:
        app: container
    spec:
      automountServiceAccountToken: false
      hostAliases:
        - ip: "169.254.1.2"
          hostnames:
            - "host.containers.internal"
            - "uber.home"
      containers:
        - name: desktop
          image: agent-desktop:latest
          imagePullPolicy: Never
          ports:
            - name: novnc
              containerPort: 6080
            - name: vnc
              containerPort: 5900
            - name: cdp
              containerPort: 9222
            - name: agent
              containerPort: 8091
          env:
            - name: GEOMETRY
              value: "1280x800x24"
            - name: DISPLAY
              value: ":99"
            - name: AGENT_PORT
              value: "8091"
            - name: AGENT_MODEL
              value: "llama-server:default"
            - name: DAD_PROXY_URL
              value: "https://host.containers.internal:1234"
            - name: LLAMA_SERVER_BASE_URL
              value: "https://host.containers.internal:1234"
            - name: DAD_PROXY_CA_FILE
              value: "/opt/certs/ca.pem"
            - name: DAD_PROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dad-proxy
                  key: api-key
                  optional: true
            - name: LLAMA_SERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dad-proxy
                  key: api-key
                  optional: true
            - name: GITLAB_URL
              value: "http://gitlab"
            - name: BROWSER_USE_USER_DATA_DIR
              value: "/home/agent/.config/browser-use-user-data-dir-live"
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab
                  key: root-password
                  optional: true
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
          resources:
            requests:
              cpu: "250m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /vnc.html
              port: novnc
            initialDelaySeconds: 8
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /vnc.html
              port: novnc
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            # Kind node is privileged and already sees host /dev/nvidia* + /dev/dri.
            # Privileged here lets the cgroup device whitelist pass those through.
            privileged: true
            seccompProfile:
              type: Unconfined
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: dri
              mountPath: /dev/dri
            - name: nvidia0
              mountPath: /dev/nvidia0
            - name: nvidiactl
              mountPath: /dev/nvidiactl
            - name: nvidia-uvm
              mountPath: /dev/nvidia-uvm
            - name: nvidia-uvm-tools
              mountPath: /dev/nvidia-uvm-tools
            - name: nvidia-modeset
              mountPath: /dev/nvidia-modeset
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: dri
          hostPath:
            path: /dev/dri
        - name: nvidia0
          hostPath:
            path: /dev/nvidia0
            type: CharDevice
        - name: nvidiactl
          hostPath:
            path: /dev/nvidiactl
            type: CharDevice
        - name: nvidia-uvm
          hostPath:
            path: /dev/nvidia-uvm
            type: CharDevice
        - name: nvidia-uvm-tools
          hostPath:
            path: /dev/nvidia-uvm-tools
            type: CharDevice
        - name: nvidia-modeset
          hostPath:
            path: /dev/nvidia-modeset
            type: CharDevice
