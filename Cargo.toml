[workspace]
resolver = "2"
members = ["app", "server"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[profile.wasm]
inherits = "release"
opt-level = "s"
debug = false
strip = "debuginfo"
codegen-units = 16
lto = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
debug = 1
